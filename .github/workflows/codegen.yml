name: Codegen

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen:
    name: Check codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run codegen
        run: yarn generate
      - name: Format generated files
        run: yarn biome check --write src/graphql/generated/graphql.ts src/graphql/graphql.schema.json
      - name: Check for changes
        run: |
          if ! git diff --exit-code src/graphql/generated/graphql.ts src/graphql/graphql.schema.json; then
            echo "Generated files are out of date. Run 'yarn generate' and commit the result."
            exit 1
          fi
